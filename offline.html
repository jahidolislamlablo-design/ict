<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <title>অফলাইন - ICT Easy Learning</title>
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Hind Siliguri', 'Inter', system-ui, -apple-system, sans-serif;
            background: #F8FAFC;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .offline-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08);
        }
        .offline-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #EEF2FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #4F46E5;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0F172A;
        }
        p {
            font-size: 0.96rem;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary {
            background: #F1F5F9;
            color: #334155;
            border: 1px solid #E2E8F0;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon" aria-hidden="true">📡</div>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>আপনি এই মুহূর্তে অফলাইনে আছেন এবং এই পেজটি আগে থেকে ক্যাশ করা নেই। ইন্টারনেট সংযোগ চালু করে আবার চেষ্টা করুন।</p>
        <div class="actions">
            <button type="button" class="btn-primary" onclick="window.location.reload()">আবার চেষ্টা করুন</button>
            <a href="/index.html" class="btn-secondary">হোম পেজ</a>
        </div>
    </div>
</body>
</html>
